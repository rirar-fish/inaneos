name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make grub-pc-bin xorriso mtools
      - name: Build OS image
        run: make
      - name: Verify multiboot header
        run: grub-file --is-x86-multiboot build/kernel.elf
      - name: Upload OS image
        uses: actions/upload-artifact@v4
        with:
          name: os-image
          path: os.iso
