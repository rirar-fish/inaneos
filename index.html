<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title> inaneos web preview </title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #00ff00;
            font-family: monospace;
            padding: 20px;
        }
        #screen {
            background-color: #000;
            border: 2px solid #333;
            padding: 10px;
            white-space: pre-wrap;
            min-height: 400px;
            font-size: 16px;
            line-height: 1.4;
            outline: none;
        }
    </style>
</head>
<body>
    <h1>inaneos (WASM mode)</h1>
    <div id="screen" tabindex="0">inane</div>
    <script>
      const screen = document.getElementById("screen");

      screen.focus();

      let wasmInstance = null;
      const memory = new WebAssembly.Memory({address: "i64", initial: 256n, maximum:256n});
      const importObject = {
        env: {
          memory: memory,
          js_putchar: (c) => {
            if (c === 8) {
              if (!screen.textContent.endsWith("$ ")) {
                screen.textContent = screen.textContent.slice(0, -1);
              }
            } else {
              screen.textContent += String.fromCharCode(c);
            }
          },
          term_set_color: (fg, bg) => {

          },
        }
      };
      WebAssembly.instantiateStreaming(fetch("inaneos.wasm"), importObject)
        .then(obj => {
          wasmInstance = obj.instance.exports;
          screen.textContent = "web preview inaneos loaded!\n\n";
          const wasm = obj.instance.exports;
          console.log("expf : ",wasmInstance);

          if (typeof wasm.kernel_main === "function") {
            wasm.kernel_main();
            screen.textContent += "[OK] loaded \n";
          } else {
            screen.textContent += "[X] func kernel_main not found \n";
          }
        })
        .catch(err => {
          screen.textContent = " [X] err loading wasm " + err;
          console.error(err);
        })
      document.addEventListener("keydown", (e) => {
        if (!wasmInstance || typeof wasmInstance.shell_handle_key !== "function") {
          return;
        }
        if (e.key === "Enter") {
          e.preventDefault();
          wasmInstance.shell_handle_key(10);
        } else if (e.key === "Backspace") {
          e.preventDefault();
          wasmInstance.shell_handle_key(8);
        } else if (e.key.length === 1) {
          e.preventDefault();
          wasmInstance.shell_handle_key(e.key.charCodeAt(0));
        }
      });
    </script>
</body>
</html>
